<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Sublimagic</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="admin-body">

  <header class="navbar">
    <div class="nav-container">
      <div class="brand">
        <img src="logo.jpg" alt="Sublimagic Logo" class="logo-circle" id="logo-img" onerror="this.src='https://placehold.co/50x50?text=Logo'">
        <h1>Sublimagic - Admin</h1>
      </div>
      <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Voltar ao Catálogo</a>
    </div>
  </header>

  <main class="container">
    <!-- Tela de Login -->
    <div id="login-container" class="admin-card">
      <h2><i class="fa-solid fa-lock"></i> Acesso Restrito</h2>
      <form id="login-form">
        <div class="form-group">
          <label for="admin-user">Usuário:</label>
          <input type="text" id="admin-user" required placeholder="Digite o usuário">
        </div>
        <div class="form-group">
          <label for="admin-pass">Senha:</label>
          <input type="password" id="admin-pass" required placeholder="Digite a senha">
        </div>
        <button type="submit" class="btn-primary">Entrar no Painel</button>
      </form>
    </div>

    <!-- Painel Principal (Aparece após o Login) -->
    <div id="admin-panel" class="admin-panel" style="display: none;">
      
      <!-- Cadastro de Produtos -->
      <section class="admin-card">
        <h2><i class="fa-solid fa-plus-circle"></i> Cadastrar Novo Produto</h2>
        <form id="product-form">
          <div class="form-group">
            <label for="p-name">Nome do Produto:</label>
            <input type="text" id="p-name" required placeholder="Ex: Caneca Porcelana Personalizada">
          </div>
          
          <div class="form-group">
            <label for="p-price">Preço (R$):</label>
            <input type="number" step="0.01" id="p-price" required placeholder="Ex: 35.00">
          </div>

          <div class="form-group">
            <label for="p-desc">Descrição do Produto:</label>
            <textarea id="p-desc" rows="3" required placeholder="Detalhes do produto, tamanho, material..."></textarea>
          </div>

          <div class="form-group">
            <label for="p-image-file">Foto do Produto (Galeria / Arquivo):</label>
            <input type="file" id="p-image-file" accept="image/*" required>
          </div>

          <button type="submit" id="save-btn" class="btn-primary">
            <i class="fa-solid fa-cloud-arrow-up"></i> Cadastrar Produto
          </button>
        </form>
      </section>

      <!-- Lista e Gerenciamento de Produtos -->
      <section class="admin-card">
        <h2><i class="fa-solid fa-list-check"></i> Produtos Cadastrados</h2>
        <div id="admin-products-list" class="admin-products-list">
          <p>Carregando produtos...</p>
        </div>
      </section>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="admin.js"></script>
</body>
</html>
